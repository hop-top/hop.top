name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    name: Lint, Test, Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: |
          npm ci
          cd worker && npm ci && cd ..
          cd docs-worker && npm ci && cd ..
          cd site && npm ci && cd ..

      - name: Lint
        run: npm run lint

      - name: Test (root)
        run: npm test

      - name: Test (worker)
        run: cd worker && npx vitest run

      - name: Test (docs-worker)
        run: cd docs-worker && npx vitest run

      - name: Test (site)
        run: cd site && npx vitest run

      - name: Test (E2E)
        run: npm run test:e2e

      - name: Build
        run: npm run build

      - name: Build (site)
        run: cd site && npx astro build
