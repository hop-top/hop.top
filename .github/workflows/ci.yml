name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    name: Lint, Test, Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: pnpm/action-setup@v6
        with:
          version: 10.33.4

      - name: Install dependencies
        run: |
          npm ci
          npm --prefix apps/cli ci
          npm --prefix apps/router ci
          pnpm --dir apps/docs-router install --frozen-lockfile
          npm --prefix apps/site ci

      - name: Lint
        run: npm run lint

      - name: Test (root)
        run: npm test

      - name: Test (router)
        run: npm --prefix apps/router test

      - name: Test (docs-router)
        run: pnpm --dir apps/docs-router test

      - name: Test (site)
        run: npm --prefix apps/site test

      - name: Test (E2E)
        run: npm run test:e2e

      - name: Build (CLI)
        run: npm --prefix apps/cli run build

      - name: Build (site)
        run: npm --prefix apps/site run build
